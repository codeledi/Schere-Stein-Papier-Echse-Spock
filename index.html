<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schere · Stein · Papier · Echse · Spock</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind-Safeguard: stellt sicher, dass dynamische Farben generiert werden -->
    <span class="hidden text-green-400 text-red-400 text-yellow-400"></span>

    <style>
      /* CSS-Sprite: SPSES.png enthält 5 Icons nebeneinander */
      .sprite {
        background-image: url("SPSES.png");
        background-size: 500% auto;
        background-repeat: no-repeat;
        width: 72px;
        height: 72px;
      }
      .sprite-stein {
        background-position: 0% 50%;
      }
      .sprite-papier {
        background-position: 25% 50%;
      }
      .sprite-schere {
        background-position: 50% 50%;
      }
      .sprite-echse {
        background-position: 75% 50%;
      }
      .sprite-spock {
        background-position: 100% 50%;
      }
    </style>
  </head>

  <body
    class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-6"
  >
    <h1 class="text-xl sm:text-3xl font-bold mb-2 text-center">
      Schere · Stein · Papier · Echse · Spock
    </h1>
    <p class="text-gray-400 mb-10 text-sm text-center">Wähle deinen Zug!</p>

    <!-- ── Auswahlbuttons ── -->
    <div id="move-buttons" class="flex flex-wrap justify-center gap-3 sm:gap-4">
      <button
        onclick="play('Stein')"
        class="flex flex-col items-center gap-2 bg-gray-800 hover:bg-gray-700 border-2 border-gray-600 hover:border-gray-400 active:scale-95 rounded-xl p-3 sm:p-4 transition-all w-24 sm:w-28"
      >
        <div class="sprite sprite-stein"></div>
        <span class="text-xs sm:text-sm font-semibold">Stein</span>
      </button>

      <button
        onclick="play('Papier')"
        class="flex flex-col items-center gap-2 bg-gray-800 hover:bg-gray-700 border-2 border-gray-600 hover:border-gray-400 active:scale-95 rounded-xl p-3 sm:p-4 transition-all w-24 sm:w-28"
      >
        <div class="sprite sprite-papier"></div>
        <span class="text-xs sm:text-sm font-semibold">Papier</span>
      </button>

      <button
        onclick="play('Schere')"
        class="flex flex-col items-center gap-2 bg-gray-800 hover:bg-gray-700 border-2 border-gray-600 hover:border-gray-400 active:scale-95 rounded-xl p-3 sm:p-4 transition-all w-24 sm:w-28"
      >
        <div class="sprite sprite-schere"></div>
        <span class="text-xs sm:text-sm font-semibold">Schere</span>
      </button>

      <button
        onclick="play('Echse')"
        class="flex flex-col items-center gap-2 bg-gray-800 hover:bg-gray-700 border-2 border-gray-600 hover:border-gray-400 active:scale-95 rounded-xl p-3 sm:p-4 transition-all w-24 sm:w-28"
      >
        <div class="sprite sprite-echse"></div>
        <span class="text-xs sm:text-sm font-semibold">Echse</span>
      </button>

      <button
        onclick="play('Spock')"
        class="flex flex-col items-center gap-2 bg-gray-800 hover:bg-gray-700 border-2 border-gray-600 hover:border-gray-400 active:scale-95 rounded-xl p-3 sm:p-4 transition-all w-24 sm:w-28"
      >
        <div class="sprite sprite-spock"></div>
        <span class="text-xs sm:text-sm font-semibold">Spock</span>
      </button>
    </div>

    <!-- ── Ergebnisbereich (anfangs versteckt) ── -->
    <div
      id="result-area"
      style="display: none"
      class="flex-col items-center gap-6"
    >
      <!-- Vergleich: Spieler vs. Computer -->
      <div
        class="flex flex-col sm:flex-row items-center gap-6 sm:gap-12 bg-gray-800 rounded-2xl p-6 sm:p-8"
      >
        <div class="flex flex-col items-center gap-2">
          <span class="text-xs text-gray-400 uppercase tracking-widest"
            >Du</span
          >
          <div id="player-sprite" class="sprite"></div>
          <span id="player-label" class="text-sm font-semibold"></span>
        </div>

        <span class="text-2xl font-bold text-gray-500">VS</span>

        <div class="flex flex-col items-center gap-2">
          <span class="text-xs text-gray-400 uppercase tracking-widest"
            >Computer</span
          >
          <div id="computer-sprite" class="sprite"></div>
          <span id="computer-label" class="text-sm font-semibold"></span>
        </div>
      </div>

      <!-- Ergebnis & Begründung -->
      <p
        id="result-text"
        class="text-2xl sm:text-3xl font-bold text-center"
      ></p>
      <p
        id="result-reason"
        class="text-gray-400 text-sm italic text-center"
      ></p>

      <!-- Nochmal spielen -->
      <button
        onclick="resetGame()"
        class="mt-2 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold py-2 px-8 rounded-xl transition-all"
      >
        🔄 Nochmal spielen
      </button>
    </div>

    <script>
      const validMoves = ["Schere", "Stein", "Papier", "Echse", "Spock"];

      // Alle 10 Gewinnkombinationen mit Begründung
      const winsAgainst = {
        Stein: [
          { move: "Schere", reason: "Stein schlägt Schere" },
          { move: "Echse", reason: "Stein zerquetscht Echse" },
        ],
        Papier: [
          { move: "Stein", reason: "Papier bedeckt Stein" },
          { move: "Spock", reason: "Papier widerlegt Spock" },
        ],
        Schere: [
          { move: "Papier", reason: "Schere schneidet Papier" },
          { move: "Echse", reason: "Schere köpft Echse" },
        ],
        Echse: [
          { move: "Spock", reason: "Echse vergiftet Spock" },
          { move: "Papier", reason: "Echse frisst Papier" },
        ],
        Spock: [
          { move: "Schere", reason: "Spock zerstört Schere" },
          { move: "Stein", reason: "Spock verdampft Stein" },
        ],
      };

      const spriteClass = {
        Stein: "sprite-stein",
        Papier: "sprite-papier",
        Schere: "sprite-schere",
        Echse: "sprite-echse",
        Spock: "sprite-spock",
      };

      function play(playerMove) {
        const computerMove =
          validMoves[Math.floor(Math.random() * validMoves.length)];

        let result, reason, colorClass;

        if (playerMove === computerMove) {
          result = "Unentschieden! 🤝";
          reason = "Gleicher Zug – Niemand gewinnt.";
          colorClass = "text-yellow-400";
        } else if (
          winsAgainst[playerMove].some((w) => w.move === computerMove)
        ) {
          result = "Du gewinnst! 🎉";
          reason = winsAgainst[playerMove].find(
            (w) => w.move === computerMove,
          ).reason;
          colorClass = "text-green-400";
        } else {
          result = "Du verlierst! 😔";
          reason = winsAgainst[computerMove].find(
            (w) => w.move === playerMove,
          ).reason;
          colorClass = "text-red-400";
        }

        // Sprites & Labels aktualisieren
        document.getElementById("player-sprite").className =
          `sprite ${spriteClass[playerMove]}`;
        document.getElementById("player-label").textContent = playerMove;
        document.getElementById("computer-sprite").className =
          `sprite ${spriteClass[computerMove]}`;
        document.getElementById("computer-label").textContent = computerMove;

        // Ergebnis anzeigen
        const resultEl = document.getElementById("result-text");
        resultEl.textContent = result;
        resultEl.className = `text-2xl sm:text-3xl font-bold text-center ${colorClass}`;
        document.getElementById("result-reason").textContent = reason;

        // UI-Zustand wechseln
        document.getElementById("move-buttons").style.display = "none";
        document.getElementById("result-area").style.display = "flex";
      }

      function resetGame() {
        document.getElementById("move-buttons").style.display = "";
        document.getElementById("result-area").style.display = "none";
      }
    </script>
  </body>
</html>
